<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
  <title id="t">نوا کلاینت (Nova Client)</title>
  <desc id="d">نوا کلاینت، کلاینت پروکسی بهینه و اختصاصی نوا به همراه اسکنر آی‌پی تمیز کلودفلر رادار نوا به‌صورت داخلی. ساخته‌شده با فلاتر، تاریک‌محور، دو زبانه، منتشرشده روی اندروید.</desc>
  <defs>
    <linearGradient id="nova" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </radialGradient>
    <clipPath id="card"><rect x="72" y="60" width="452" height="320" rx="24"/></clipPath>
    <clipPath id="frame"><rect width="1200" height="430" rx="26"/></clipPath>
  </defs>

  <rect width="1200" height="430" rx="26" fill="#05060a"/>
  <g clip-path="url(#frame)">
    <ellipse cx="1050" cy="70" rx="420" ry="300" fill="url(#glowC)"/>
    <ellipse cx="120" cy="400" rx="460" ry="320" fill="url(#glowV)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="429" rx="25.5" fill="none" stroke="#141a26"/>

  <!-- Right: identity (RTL) -->
  <rect x="1040" y="64" width="88" height="88" rx="22" fill="url(#nova)"/>
  <path d="M1062 133 L1062 83 L1106 133 L1106 83" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="1024" y="96" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#7f92ad">NOVA CLIENT</text>
  <text x="1024" y="142" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="46" font-weight="800" fill="url(#nova)">نوا کلاینت</text>

  <text x="1128" y="212" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="24" font-weight="500" fill="#cdd8ea">کلاینت پروکسی بهینه و اختصاصی نوا، به‌همراه اسکنر</text>
  <text x="1128" y="248" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="24" font-weight="500" fill="#cdd8ea">آی‌پی تمیز <tspan font-weight="700" fill="#22d3ee">رادار نوا</tspan> به‌صورت داخلی.</text>

  <!-- proof chips (RTL, right-aligned) -->
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="18" font-weight="600">
    <g>
      <rect x="912" y="288" width="216" height="42" rx="21" fill="#0d1524" stroke="#26324a"/>
      <circle cx="1106" cy="309" r="4.5" fill="url(#nova)"/>
      <text x="1092" y="315" text-anchor="end" fill="#dbe4f2">ساخته‌شده با فلاتر</text>
    </g>
    <g>
      <rect x="754" y="288" width="144" height="42" rx="21" fill="#0d1524" stroke="#26324a"/>
      <circle cx="876" cy="309" r="4.5" fill="url(#nova)"/>
      <text x="862" y="315" text-anchor="end" fill="#dbe4f2">تاریک‌محور</text>
    </g>
    <g>
      <rect x="1006" y="342" width="122" height="42" rx="21" fill="#0d1524" stroke="#26324a"/>
      <circle cx="1106" cy="363" r="4.5" fill="url(#nova)"/>
      <text x="1092" y="369" text-anchor="end" fill="#dbe4f2">دو زبانه</text>
    </g>
    <g>
      <rect x="806" y="342" width="186" height="42" rx="21" fill="#0d1524" stroke="#26324a"/>
      <circle cx="970" cy="363" r="4.5" fill="url(#nova)"/>
      <text x="956" y="369" text-anchor="end" fill="#dbe4f2">منتشرشده روی اندروید</text>
    </g>
  </g>

  <!-- Left: radar / connect card -->
  <rect x="72" y="60" width="452" height="320" rx="24" fill="#0a0e18" stroke="#1c2740"/>
  <g clip-path="url(#card)">
    <ellipse cx="298" cy="150" rx="240" ry="180" fill="url(#glowC)"/>
  </g>

  <text x="500" y="98" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#e6edf7">رادار نوا</text>
  <text x="500" y="120" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="13" fill="#7f92ad">اسکن آی‌پی تمیز</text>
  <rect x="98" y="80" width="104" height="30" rx="15" fill="#0e2a20" stroke="#0e3a44"/>
  <circle cx="118" cy="95" r="4.5" fill="#22d3ee"/>
  <text x="132" y="100" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="14" font-weight="600" fill="#22d3ee">متصل</text>

  <g transform="translate(298 214)">
    <circle r="96" fill="none" stroke="#1c3a48" stroke-width="1"/>
    <circle r="72" fill="none" stroke="#183342" stroke-width="1"/>
    <circle r="48" fill="none" stroke="#183342" stroke-width="1"/>
    <circle r="24" fill="none" stroke="#183342" stroke-width="1"/>
    <line x1="-96" y1="0" x2="96" y2="0" stroke="#152a37" stroke-width="1"/>
    <line x1="0" y1="-96" x2="0" y2="96" stroke="#152a37" stroke-width="1"/>
    <path d="M0 0 L-8.4 -95.6 A96 96 0 0 1 73.5 -61.7 Z" fill="url(#sweep)"/>
    <line x1="0" y1="0" x2="-8.4" y2="-95.6" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.85"/>
    <circle cx="-38" cy="-70" r="3" fill="#33415c"/>
    <circle cx="58" cy="30" r="3" fill="#33415c"/>
    <circle cx="-62" cy="18" r="3" fill="#33415c"/>
    <circle cx="20" cy="64" r="3" fill="#33415c"/>
    <circle cx="70" cy="-18" r="3" fill="#33415c"/>
    <circle cx="38" cy="-58" r="8" fill="#22d3ee" opacity="0.18"/>
    <circle cx="38" cy="-58" r="4" fill="#22d3ee"/>
    <circle cx="-44" cy="-24" r="8" fill="#818cf8" opacity="0.18"/>
    <circle cx="-44" cy="-24" r="4" fill="#818cf8"/>
    <circle cx="24" cy="40" r="8" fill="#a855f7" opacity="0.18"/>
    <circle cx="24" cy="40" r="4" fill="#a855f7"/>
    <circle r="15" fill="url(#orb)"/>
    <circle r="15" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14.5">
    <circle cx="98" cy="343" r="4" fill="#22d3ee"/>
    <text x="112" y="348" fill="#c7d2e5">162.159.204.11:443</text>
    <text x="498" y="348" text-anchor="end" fill="#22d3ee">28 ms</text>
    <circle cx="98" cy="367" r="4" fill="#818cf8"/>
    <text x="112" y="372" fill="#c7d2e5">104.16.132.229:443</text>
    <text x="498" y="372" text-anchor="end" fill="#22d3ee">41 ms</text>
  </g>
</svg>
